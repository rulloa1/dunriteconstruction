<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:#cfc9bc; }
  body{ font-family:"Source Serif 4",Georgia,serif; color:#1d2127; -webkit-font-smoothing:antialiased; }
  .sheet{ width:816px; max-width:100%; min-height:1056px; margin:24px auto; background:#fff; display:flex; flex-direction:column; box-shadow:0 10px 34px rgba(29,33,39,0.18); }
  @media print{
    html,body{ background:#fff; }
    .noprint{ display:none !important; }
    @page{ size:letter; margin:0; }
    html{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .sheet{ width:auto; min-height:10.95in; margin:0; box-shadow:none; break-after:page; }
    .sheet:last-child{ break-after:auto; }
  }
</style>
</helmet>
<main>

  <div class="noprint" style="max-width:816px; margin:24px auto 0; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; font-family:'IBM Plex Mono',monospace;">
    <div style="font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:#5b5f66;">Binder cover sheets · 3 front-pocket inserts + spine labels</div>
    <button onClick="{{ onPrint }}" style="font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#fff; background:#15273b; border:none; border-radius:4px; padding:9px 18px; cursor:pointer;">Print / Save as PDF</button>
  </div>

  <sc-for list="{{ binders }}" as="b" hint-placeholder-count="3">
    <section class="sheet" data-screen-label="{{ b.label }}">
      <div style="background:#15273b; display:flex; justify-content:space-between; align-items:center; padding:13px 44px;">
        <span style="font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.22em; text-transform:uppercase; color:#8fa5bb;">DunRite Construction Group LLC</span>
        <span style="font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.22em; text-transform:uppercase; color:#1ca0e0;">2026 Edition · Rev 1.0</span>
      </div>
      <div style="height:4px; background:linear-gradient(90deg,#0e6ea8 0%,#1ca0e0 60%,#dce9f4 100%);"></div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; text-align:center; justify-content:center; padding:40px 84px;">
        <img src="assets/dunrite-logo-dark.png" alt="DunRite Construction Group LLC" style="display:block; width:250px; max-width:62%; height:auto; margin:0 auto;">
        <div style="margin:52px 0 0; display:inline-flex; align-items:center; border:1.5px solid #0e6ea8; border-radius:999px; padding:8px 22px;">
          <span style="font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.26em; text-transform:uppercase; color:#0e6ea8; white-space:nowrap;">Binder {{ b.num }} / 03</span>
        </div>
        <div style="margin:28px 0 0; font-family:'Archivo',sans-serif; font-weight:600; font-size:14px; letter-spacing:0.34em; text-transform:uppercase; color:#1ca0e0;">{{ b.kicker }}</div>
        <h1 style="font-family:'Archivo',sans-serif; font-weight:800; font-size:62px; line-height:1.0; letter-spacing:-0.028em; margin:16px 0 0; color:#1d2127; white-space:pre-line;">{{ b.title }}</h1>
        <div style="width:64px; height:3px; background:#1ca0e0; margin:30px auto 0; border-radius:2px;"></div>
        <div style="margin:30px 0 0; display:flex; flex-direction:column; gap:8px;">
          <sc-for list="{{ b.contents }}" as="c" hint-placeholder-count="4">
            <div style="display:flex; align-items:baseline; gap:12px; justify-content:center; font-family:'Archivo',sans-serif; font-weight:600; font-size:16px; color:#1d2127;"><span style="font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:11px; color:#1ca0e0;">{{ c.n }}</span><span>{{ c.t }}</span></div>
          </sc-for>
        </div>
      </div>
      <div style="background:#15273b; text-align:center; padding:12px 20px;">
        <span style="font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.18em; text-transform:uppercase; color:#8fa5bb;">Confidential — Internal Use Only</span>
      </div>
    </section>
  </sc-for>

  <!-- SPINE LABELS -->
  <section class="sheet" data-screen-label="Spine Labels" style="flex-direction:row; align-items:stretch; justify-content:center; gap:40px; padding:48px 0;">
    <sc-for list="{{ binders }}" as="b" hint-placeholder-count="3">
      <div style="width:170px; border:1.5px dashed #8b8f96; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:26px 12px; background:#fff;">
        <img src="assets/dunrite-mark.png" alt="" style="width:64px; height:auto; display:block;">
        <div style="writing-mode:vertical-rl; transform:rotate(180deg); display:flex; align-items:center; gap:16px;">
          <span style="font-family:'Archivo',sans-serif; font-weight:800; font-size:30px; letter-spacing:0.02em; color:#15273b;">{{ b.plain }}</span>
          <span style="font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.22em; text-transform:uppercase; color:#0e6ea8;">Binder {{ b.num }} · 2026</span>
        </div>
        <div style="font-family:'Archivo',sans-serif; font-weight:800; font-size:26px; color:#1ca0e0;">{{ b.short }}</div>
      </div>
    </sc-for>
  </section>

</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:816}}">
class Component extends DCLogic {
  renderVals(){
    return {
      onPrint: () => window.print(),
      binders: [
        { num:"01", short:"1", label:"Cover Binder 1", kicker:"Read & Sign", title:"Employee\nHandbook", plain:"Employee Handbook",
          contents:[ {n:"01",t:"Employee Handbook"}, {n:"02",t:"New Hire Orientation Guide"}, {n:"03",t:"Drug-Free Workplace Program"}, {n:"04",t:"Employee Sign-Off Forms"} ] },
        { num:"02", short:"2", label:"Cover Binder 2", kicker:"Field & Fleet", title:"Safety\nManual", plain:"Safety Manual",
          contents:[ {n:"01",t:"Safety Manual"}, {n:"02",t:"Fleet Safety Program"}, {n:"—",t:"In-Vehicle Report Packet (separate, per truck)"} ] },
        { num:"03", short:"3", label:"Cover Binder 3", kicker:"Office Operations", title:"Forms\nBook", plain:"Forms Book",
          contents:[ {n:"01",t:"HR Forms Pack"}, {n:"02",t:"Field Forms Pack"}, {n:"03",t:"Financial Forms Pack"}, {n:"04",t:"Project & Closeout Forms"} ] },
      ],
    };
  }
}
</script>
</body>
</html>
